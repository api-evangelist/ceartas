    name: Star
    type: subscription
    description: >
      Entry tier for rising creators. Basic AI scanning on a ~6-day cadence, unlimited
      Google search-result removals, and 300 manual takedowns. US/BR coverage.
    entries:
      - label: Monthly subscription (recurring)
        name: star_monthly
        type: recurring
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
