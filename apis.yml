description: >-
  Ceartas (legal entity Ceartas DMCA Limited) is a Dublin, Ireland AI-powered brand
  protection and content-removal platform founded in 2021 by Dan Purcell (CEO) and Jonny
  Smyth (CTO). Backed by the Sony Innovation Fund with a $4.5M seed round announced in
  April 2024, Ceartas is a Google Trusted Copyright Removal Partner and runs a dual-brand
  stack: Ceartas for individual creators and talent, and Midnight Labs for enterprise IP
  holders including movie studios, gaming studios, broadcasters, and publishers. The
  platform scans 75M+ sites daily across 2,000+ platforms and has processed billions of
  takedowns, protecting creators, A-list talent, and global brands from AI-generated
  deepfakes, non-consensual intimate imagery (NCII), piracy, impersonation, and
  counterfeit content. Enforcement operates under DMCA §512, the US TAKE IT DOWN Act, the
  UK Online Safety Act, the EU Digital Services Act, and Ireland's Coco's Law. Ceartas is
  a subscription SaaS with a customer dashboard and no public developer API; this profile
  captures its published identity, pricing, status, and security/AI-consent surface.
